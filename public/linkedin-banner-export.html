<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1584" />
  <title>LinkedIn Banner Export</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1584px; height: 396px; overflow: hidden; background: #000; }
    .banner {
      width: 1584px; height: 396px;
      background: #000; position: relative; overflow: hidden;
    }
    .grain {
      position: absolute; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      opacity: 0.04; background-size: 200px 200px;
    }
    .bar { position: absolute; left: 0; top: 0; bottom: 0; width: 6px; background: #ffcc00; }
    .name-block {
      position: absolute; left: 22%; top: 0; bottom: 0;
      display: flex; flex-direction: column; justify-content: center;
    }
    .name {
      font-family: 'Inter Tight', 'Helvetica Neue', Helvetica, Arial, sans-serif;
      font-weight: 800; font-size: 88px; color: #fff;
      line-height: 0.88; letter-spacing: -0.045em; text-transform: uppercase;
    }
    .rule { width: 60px; height: 3px; background: #ffcc00; margin: 16px 0; }
    .role {
      font-family: 'Inter Tight', 'Helvetica Neue', Helvetica, Arial, sans-serif;
      font-weight: 500; font-size: 22px; color: #9a9a9a; letter-spacing: 0.01em;
    }
    .url {
      position: absolute; bottom: 18px; left: 22%;
      font-family: 'JetBrains Mono', monospace; font-size: 11px;
      color: #333; letter-spacing: 0.12em; text-transform: uppercase;
    }
    .wheel-wrap {
      position: absolute; right: 3%; top: 0; bottom: 0;
      width: 32%; display: flex; align-items: center; justify-content: center;
    }
  </style>
</head>
<body>
  <div class="banner">
    <div class="grain"></div>
    <div class="bar"></div>
    <div class="name-block">
      <div class="name">Lucas<br>Daneluz</div>
      <div class="rule"></div>
      <div class="role">Product Manager</div>
    </div>
    <div class="url">lucasdaneluz.com</div>
    <div class="wheel-wrap">
      <svg viewBox="0 0 500 420" width="380" height="320">
        <circle cx="220" cy="210" r="108" fill="none" stroke="#252525" stroke-width="1.5"/>
        <line x1="220" y1="250" x2="220" y2="102" stroke="#1e1e1e" stroke-width="1"/>
        <circle cx="220" cy="102" r="6" fill="#ffcc00"/>
        <text x="220" y="78" text-anchor="middle" dominant-baseline="middle" fill="#ffcc00" font-size="14" font-family="'Inter Tight','Helvetica Neue',Helvetica,Arial,sans-serif" font-weight="700" letter-spacing="-0.01em">Discovery</text>
        <line x1="258" y1="177" x2="322" y2="143" stroke="#1e1e1e" stroke-width="1"/>
        <circle cx="322" cy="143" r="6" fill="rgba(255,255,255,0.73)"/>
        <text x="341" y="143" text-anchor="start" dominant-baseline="middle" fill="rgba(255,255,255,0.73)" font-size="14" font-family="'Inter Tight','Helvetica Neue',Helvetica,Arial,sans-serif" font-weight="600" letter-spacing="-0.01em">Prioritisation</text>
        <line x1="252" y1="244" x2="303" y2="297" stroke="#1e1e1e" stroke-width="1"/>
        <circle cx="303" cy="297" r="6" fill="rgba(255,255,255,0.61)"/>
        <text x="319" y="289" text-anchor="start" dominant-baseline="middle" fill="rgba(255,255,255,0.61)" font-size="14" font-family="'Inter Tight','Helvetica Neue',Helvetica,Arial,sans-serif" font-weight="600" letter-spacing="-0.01em">Stakeholder</text>
        <text x="319" y="305" text-anchor="start" dominant-baseline="middle" fill="rgba(255,255,255,0.61)" font-size="14" font-family="'Inter Tight','Helvetica Neue',Helvetica,Arial,sans-serif" font-weight="600" letter-spacing="-0.01em">Alignment</text>
        <line x1="188" y1="244" x2="137" y2="297" stroke="#1e1e1e" stroke-width="1"/>
        <circle cx="137" cy="297" r="6" fill="rgba(255,255,255,0.49)"/>
        <text x="121" y="289" text-anchor="end" dominant-baseline="middle" fill="rgba(255,255,255,0.49)" font-size="14" font-family="'Inter Tight','Helvetica Neue',Helvetica,Arial,sans-serif" font-weight="600" letter-spacing="-0.01em">Clarity in</text>
        <text x="121" y="305" text-anchor="end" dominant-baseline="middle" fill="rgba(255,255,255,0.49)" font-size="14" font-family="'Inter Tight','Helvetica Neue',Helvetica,Arial,sans-serif" font-weight="600" letter-spacing="-0.01em">Ambiguity</text>
        <line x1="182" y1="177" x2="118" y2="143" stroke="#1e1e1e" stroke-width="1"/>
        <circle cx="118" cy="143" r="6" fill="rgba(255,255,255,0.37)"/>
        <text x="101" y="143" text-anchor="end" dominant-baseline="middle" fill="rgba(255,255,255,0.37)" font-size="14" font-family="'Inter Tight','Helvetica Neue',Helvetica,Arial,sans-serif" font-weight="600" letter-spacing="-0.01em">Metrics</text>
        <circle cx="220" cy="210" r="38" fill="#ffcc00"/>
        <text x="220" y="210" text-anchor="middle" dominant-baseline="middle" fill="#000" font-size="13" font-family="'Inter Tight','Helvetica Neue',Helvetica,Arial,sans-serif" font-weight="700" letter-spacing="-0.02em">product</text>
      </svg>
    </div>
  </div>
</body>
</html>
